name: Codex resolver validation

on:
  pull_request:
    branches:
      - experimental
  workflow_dispatch:

concurrency:
  group: codex-resolver-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Checks, tests, and web export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Africa/Cairo

    steps:
      - name: Check out the proposed change
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Validate Expo web export
        run: npx expo export -p web
