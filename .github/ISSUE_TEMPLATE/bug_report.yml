name: Bug Report
description: Report a reproducible bug in TrustFlow.
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        **Before submitting:** search [open issues](https://github.com/abyssrift/TrustFlow/issues) first.
        Duplicate reports slow things down.

        For security vulnerabilities, **do not open a public issue** —
        report privately via the repo's Security tab instead.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched [open issues](https://github.com/abyssrift/TrustFlow/issues?q=is%3Aissue+is%3Aopen) and did not find an existing report of this bug.
          required: true
        - label: This is **not** a security vulnerability. (Report privately via the repo's Security tab instead.)
          required: true
        - label: I am running the latest code from the default branch and the bug still reproduces there.
          required: true

  - type: dropdown
    id: tier
    attributes:
      label: Tier
      description: Priority classification — see Features.md for definitions.
      options:
        - "-- Please Select --"
        - "Tier 1: Critical (Crash / Data Loss / Blocking)"
        - "Tier 2: High (UX Friction & Core Polish)"
        - "Tier 3: Medium (Product Enhancements)"
        - "Tier 4: Low / Long-Term (Architectural & Strategy)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - "-- Please Select --"
        - Linux
        - macOS
        - Windows
        - Android
        - iOS
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps that reliably trigger the bug. The more specific, the faster this gets fixed.
      placeholder: |
        1. Go to ...
        2. Click / type ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include the full error message if there is one.
    validations:
      required: true


  - type: dropdown
    id: willing_to_fix
    attributes:
      label: Are you willing to submit a fix?
      options:
        - "-- Please Select --"
        - "Yes — I can open a PR"
        - "Partially — I can help but need guidance"
        - "No — I am not available currently"
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: Anything else that might help — browser console errors, related issues, things you already tried, or environment quirks.
